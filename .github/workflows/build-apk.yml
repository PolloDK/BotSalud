name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - 'android-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: android-app/package-lock.json

      - name: Install dependencies
        working-directory: android-app
        run: npm ci

      - name: Run tests
        working-directory: android-app
        run: npx jest --no-coverage

      - name: Write build tag into app
        working-directory: android-app
        run: |
          echo "// Auto-generated by CI — do not edit manually" > src/buildInfo.ts
          echo "export const BUILD_TAG = 'build-${{ github.run_number }}';" >> src/buildInfo.ts

      - name: Build JS bundle
        working-directory: android-app
        run: |
          mkdir -p /tmp/ota-bundle
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output /tmp/ota-bundle/index.android.bundle
          cd /tmp && zip -j bundle.zip ota-bundle/index.android.bundle

      - name: Make gradlew executable
        working-directory: android-app/android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: android-app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: "Automatic build from commit ${{ github.sha }}"
          files: |
            android-app/android/app/build/outputs/apk/release/app-release.apk
            /tmp/bundle.zip
